[project]
name = "ds-challenge"
version = "0.1.0"
description = "Predicting major STM metro service interruptions"
readme = "README.md"
authors = [
    { name = "tusanpham", email = "phamtusan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
